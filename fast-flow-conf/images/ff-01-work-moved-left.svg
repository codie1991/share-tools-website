<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="340" rx="16" fill="#FAF7F2"/>
  <text x="40" y="58" font-size="30" font-weight="700" fill="#213D4A">The work moved left</text>
