  <rect x="60" y="100" width="560" height="26" rx="13" fill="#E8B95A"/>
  <rect x="60" y="100" width="300" height="26" rx="13" fill="#E5604D"/>
  <g font-size="15" font-weight="700" fill="#213D4A" text-anchor="middle">
