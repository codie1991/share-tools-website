  <rect x="275" y="220" width="360" height="46" rx="6" fill="#213D4A"/>
  <rect x="635" y="220" width="240" height="46" rx="6" fill="#E8B95A"/>
  <g fill="#213D4A" font-size="14" text-anchor="middle">
