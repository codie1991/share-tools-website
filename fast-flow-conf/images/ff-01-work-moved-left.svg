    <text x="575" y="290">●●</text><text x="695" y="290">●</text><text x="815" y="290">●</text>
  </g>
  <text x="40" y="322" font-size="14" fill="#5F7F80" font-style="italic">Dots are people on the work. Engineers now sit upstream, where the decisions are. (Redrawn from Dylan Ratcliffe's slide)</text>
