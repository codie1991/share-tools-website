    <rect x="825" y="40" width="14" height="14" rx="3" fill="#E8B95A"/><text x="845" y="52">Agent</text>
  </g>
  <g font-size="13" fill="#5F7F80" text-anchor="middle">
    <text x="215" y="100">Idea</text><text x="335" y="100">Research</text><text x="455" y="100">Shape</text>
